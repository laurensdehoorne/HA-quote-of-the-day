name: Release

# Creates a GitHub release (and its tag) for the version in manifest.json,
# with quote_of_the_day.zip attached: HACS installs from that zip
# (zip_release in hacs.json) instead of downloading every file separately.
# Runs when a v* tag is pushed, or by hand from the Actions tab
# ("Run workflow"), which tags the current main.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Determine the version
        id: version
        run: |
          version=$(jq -r .version custom_components/quote_of_the_day/manifest.json)
          tag="v${version}"
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "${GITHUB_REF_NAME}" != "${tag}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match manifest version ${version}"
            exit 1
          fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

      - name: Build the zip for HACS
        run: |
          cd custom_components/quote_of_the_day
          zip -r -X "$GITHUB_WORKSPACE/quote_of_the_day.zip" . -x "__pycache__/*" "*.pyc"
          unzip -l "$GITHUB_WORKSPACE/quote_of_the_day.zip"

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; (re)attaching the zip"
          else
            notes=".github/release-notes/${TAG}.md"
            if [ -f "$notes" ]; then
              args=(--notes-file "$notes")
            else
              args=(--generate-notes)
            fi
            gh release create "$TAG" --target "$GITHUB_SHA" --title "$TAG" "${args[@]}"
          fi
          gh release upload "$TAG" quote_of_the_day.zip --clobber
